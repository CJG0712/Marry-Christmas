      let nextFwTime = 0;

      function pickFwColors() {
        const r = Math.random();
        if (r < 0.38) return [C_ICE, C_ROSE];
        if (r < 0.68) return [C_ROSE, C_BLUSH];
        if (r < 0.86) return [C_ICE, C_GOLD];
        return [C_SAPPHIRE, C_ROSE];
      }

      function burstFirework(x, y, z, colA, colB, style) {
        // Luminous epicenter flash bloom!
        flashes.push({ x, y, z, col: colA, life: 1.0, size: 7.5 });

        const count = style === 'heart' ? 96 : (isMobile ? 96 : 150);
        const speedBase = style === 'willow' ? 2.9 : 4.1;

        for (let i = 0; i < count; i++) {
          let vx, vy, vz, col = colA;
          if (style === 'heart') {
            const t = (i / count) * Math.PI * 2;
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            const sc = 0.21 * (0.90 + Math.random() * 0.18);
            vx = hx * sc; vy = hy * sc; vz = (Math.random() - 0.5) * 0.4;
            col = i % 3 === 0 ? C_BLUSH : C_ROSE;
          } else if (style === 'double') {
            // Double-shell luxury chrysanthemum (vivid outer ice-blue shell + glowing inner rose-pink core!)
            const u = Math.random() * 2 - 1;
            const theta = Math.random() * Math.PI * 2;
            const sq = Math.sqrt(1 - u * u);
            const inner = i % 3 === 0;
            const spd = speedBase * (inner ? (0.48 + Math.random() * 0.14) : (0.92 + Math.random() * 0.18));
            vx = sq * Math.cos(theta) * spd;
            vy = u * spd;
            vz = sq * Math.sin(theta) * spd * 0.65;
            col = inner ? colB : colA;
          } else if (style === 'ring') {
            const a = (i / count) * Math.PI * 2;
            const ring = i % 2 === 0 ? 1.0 : 0.60;
            vx = Math.cos(a) * speedBase * ring;
            vy = Math.sin(a) * speedBase * ring;
            vz = (Math.random() - 0.5) * 0.55;
            col = i % 2 === 0 ? colA : colB;
          } else {
            // Cascading weeping willow
            const u = Math.random() * 2 - 1;
            const theta = Math.random() * Math.PI * 2;
            const sq = Math.sqrt(1 - u * u);
            const spd = speedBase * (0.38 + Math.pow(Math.random(), 0.52) * 0.82);
            vx = sq * Math.cos(theta) * spd;
            vy = u * spd;
            vz = sq * Math.sin(theta) * spd * 0.65;
            col = Math.random() < 0.62 ? colA : colB;
          }

          sparks.push({
            x, y, z, vx, vy, vz,
            col,
            life: 1.0,
            decay: style === 'willow' ? (0.32 + Math.random() * 0.14) : (0.42 + Math.random() * 0.22),
            gravity: style === 'willow' ? 1.85 : 1.15,
            drag: style === 'willow' ? 1.38 : 1.78,
            size: 1.55 + Math.random() * 1.25,
            strobe: Math.random() < 0.45,
            trail: [[x, y, z]]
          });
        }
      }

      function launchFirework3D(destX, destY, destZ, fastClick = false) {
        const [colA, colB] = pickFwColors();
        const sr = Math.random();
        const style = sr < 0.24 ? 'heart' : (sr < 0.56 ? 'double' : (sr < 0.80 ? 'willow' : 'ring'));
        const tx = destX !== undefined ? destX : (Math.random() < 0.5 ? -(3.2 + Math.random() * 4.2) : (3.2 + Math.random() * 4.2));
        const ty = destY !== undefined ? destY : (1.5 + Math.random() * 3.5);
        const tz = destZ !== undefined ? destZ : (-2.8 - Math.random() * 3.0);

        rockets.push({
          sx: tx + (Math.random() - 0.5) * (fastClick ? 0.35 : 0.9),
          sy: -3.6,
          sz: tz,
          tx, ty, tz,
          x: tx, y: -3.6, z: tz,
          elapsed: 0,
          duration: fastClick ? 0.30 : (0.46 + Math.random() * 0.14),
          colA, colB, style,
          trail: [[tx, -3.6, tz]]
        });
      }

      // Exact 3D Ray Unprojection so clicking ANY pixel launches a rocket that explodes on THAT EXACT PIXEL!
      let lastViewMat = mat4LookAt([0, 0.72, 13.8], [0, 0.42, 0], [0, 1, 0]);

      function screenToWorldAtZ(clientX, clientY, targetZ) {
        const aspect = Math.max(0.3, W / Math.max(1, H));
        const ndcX = (clientX / Math.max(1, W)) * 2.0 - 1.0;
        const ndcY = 1.0 - (clientY / Math.max(1, H)) * 2.0;
        const tanHalf = Math.tan(FOV_RAD * 0.5);

        // View-space ray direction
        const vx = ndcX * aspect * tanHalf;
        const vy = ndcY * tanHalf;
        const vz = -1.0;

        // Orthonormal inverse of view matrix upper-left 3x3
        const m = lastViewMat;
        const dx = m[0] * vx + m[1] * vy + m[2] * vz;
        const dy = m[4] * vx + m[5] * vy + m[6] * vz;
        const dz = m[8] * vx + m[9] * vy + m[10] * vz;

        const safeDz = Math.abs(dz) < 0.001 ? -0.001 : dz;
        const tHit = (targetZ - camEye[2]) / safeDz;
        return [
          camEye[0] + dx * tHit,
          camEye[1] + dy * tHit,
          targetZ
        ];
      }

      function spawnClickBeacon(clientX, clientY) {
        const el = document.createElement('div');
        el.className = 'click-beacon';
        el.style.left = clientX + 'px';
        el.style.top = clientY + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 500);
      }

      function stepFireworks(now, dt) {
        if (currentAct === ACT_TREE && now > nextFwTime) {
          const side = Math.random();
          const tx = side < 0.46 ? -(3.2 + Math.random() * 4.4)
                   : (side < 0.92 ? (3.2 + Math.random() * 4.4) : (Math.random() - 0.5) * 3.8);
          const ty = 1.6 + Math.random() * 3.4;
          const tz = -3.0 - Math.random() * 2.8;
          launchFirework3D(tx, ty, tz, false);
          nextFwTime = now + 680 + Math.random() * 640;
        } else if (currentAct === ACT_MESSAGE && now > nextFwTime) {
          const tx = Math.random() < 0.5 ? -(4.5 + Math.random() * 3.2) : (4.5 + Math.random() * 3.2);
          const ty = 1.6 + Math.random() * 2.6;
          launchFirework3D(tx, ty, -3.5, false);
          nextFwTime = now + 2200 + Math.random() * 1800;
        }

        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i];
          r.elapsed += dt;
          const p = Math.min(1, r.elapsed / r.duration);
          const ease = 1 - Math.pow(1 - p, 2.3);
          r.x = r.sx + (r.tx - r.sx) * ease;
          r.y = r.sy + (r.ty - r.sy) * ease;
          r.z = r.sz;
          r.trail.push([r.x, r.y, r.z]);
          if (r.trail.length > 9) r.trail.shift();
          if (p >= 1) {
            burstFirework(r.tx, r.ty, r.tz, r.colA, r.colB, r.style);
            rockets.splice(i, 1);
          }
        }

        for (let i = sparks.length - 1; i >= 0; i--) {
          const s = sparks[i];
          const dragF = Math.exp(-s.drag * dt);
          s.vx *= dragF;
          s.vy = s.vy * dragF - s.gravity * dt;
          s.vz *= dragF;
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          s.z += s.vz * dt;
          s.trail.push([s.x, s.y, s.z]);
          if (s.trail.length > 8) s.trail.shift();
          s.life -= s.decay * dt;
          if (s.life <= 0) sparks.splice(i, 1);
        }

        for (let i = flashes.length - 1; i >= 0; i--) {
          flashes[i].life -= dt * 3.2;
          if (flashes[i].life <= 0) flashes.splice(i, 1);
        }

        let lineV = 0;
        let ptV = 0;
        const dimAct4 = currentAct === ACT_MESSAGE ? 0.56 : 1.0;

        // Pack epicenter sky flashes
        for (let i = 0; i < flashes.length && ptV < MAX_FW_PTS; i++) {
          const fl = flashes[i];
          fwPtPos[ptV * 3] = fl.x; fwPtPos[ptV * 3 + 1] = fl.y; fwPtPos[ptV * 3 + 2] = fl.z;
          fwPtCol[ptV * 3] = fl.col[0]; fwPtCol[ptV * 3 + 1] = fl.col[1]; fwPtCol[ptV * 3 + 2] = fl.col[2];
          fwPtAlpha[ptV] = fl.life * fl.life * 0.85 * dimAct4;
          fwPtSize[ptV] = fl.size * (1.2 - fl.life * 0.4);
          ptV++;
        }

        // Pack rockets (glowing continuous ascent trail + blazing head)
        for (let i = 0; i < rockets.length; i++) {
          const r = rockets[i];
          for (let j = 1; j < r.trail.length && lineV + 2 <= MAX_FW_LINES; j++) {
            const p0 = r.trail[j - 1], p1 = r.trail[j];
            const ratio = j / r.trail.length;
            fwLinePos[lineV * 3] = p0[0]; fwLinePos[lineV * 3 + 1] = p0[1]; fwLinePos[lineV * 3 + 2] = p0[2];
            fwLineCol[lineV * 3] = r.colA[0]; fwLineCol[lineV * 3 + 1] = r.colA[1]; fwLineCol[lineV * 3 + 2] = r.colA[2];
            fwLineAlpha[lineV] = (ratio * 0.65) * dimAct4;
            lineV++;

            fwLinePos[lineV * 3] = p1[0]; fwLinePos[lineV * 3 + 1] = p1[1]; fwLinePos[lineV * 3 + 2] = p1[2];
            fwLineCol[lineV * 3] = 1.0; fwLineCol[lineV * 3 + 1] = 1.0; fwLineCol[lineV * 3 + 2] = 1.0;
            fwLineAlpha[lineV] = ratio * 0.95 * dimAct4;
            lineV++;
          }
          if (ptV < MAX_FW_PTS) {
            fwPtPos[ptV * 3] = r.x; fwPtPos[ptV * 3 + 1] = r.y; fwPtPos[ptV * 3 + 2] = r.z;
            fwPtCol[ptV * 3] = r.colA[0]; fwPtCol[ptV * 3 + 1] = r.colA[1]; fwPtCol[ptV * 3 + 2] = r.colA[2];
            fwPtAlpha[ptV] = 1.0 * dimAct4;
            fwPtSize[ptV] = 2.4;
            ptV++;
          }
        }

        // Pack sparks (smooth continuous curved streaks + sparkling diamond heads)
        for (let i = 0; i < sparks.length; i++) {
          const s = sparks[i];
          const strobeFlicker = (s.strobe && s.life < 0.42)
            ? (Math.sin(now * 0.045 + i * 3.1) > 0.15 ? 1.15 : 0.25)
            : (0.78 + 0.22 * Math.sin(now * 0.02 + i));
          const headA = Math.pow(s.life, 1.05) * strobeFlicker * dimAct4;

          for (let j = 1; j < s.trail.length && lineV + 2 <= MAX_FW_LINES; j++) {
            const p0 = s.trail[j - 1], p1 = s.trail[j];
            const r0 = (j - 1) / s.trail.length;
            const r1 = j / s.trail.length;

            fwLinePos[lineV * 3] = p0[0]; fwLinePos[lineV * 3 + 1] = p0[1]; fwLinePos[lineV * 3 + 2] = p0[2];
            fwLineCol[lineV * 3] = s.col[0]; fwLineCol[lineV * 3 + 1] = s.col[1]; fwLineCol[lineV * 3 + 2] = s.col[2];
            fwLineAlpha[lineV] = headA * r0 * 0.82;
            lineV++;

            fwLinePos[lineV * 3] = p1[0]; fwLinePos[lineV * 3 + 1] = p1[1]; fwLinePos[lineV * 3 + 2] = p1[2];
            fwLineCol[lineV * 3] = Math.min(1, s.col[0] + 0.35 * r1);
            fwLineCol[lineV * 3 + 1] = Math.min(1, s.col[1] + 0.35 * r1);
            fwLineCol[lineV * 3 + 2] = Math.min(1, s.col[2] + 0.35 * r1);
            fwLineAlpha[lineV] = headA * r1 * 0.96;
            lineV++;
          }

          if (ptV < MAX_FW_PTS) {
            fwPtPos[ptV * 3] = s.x; fwPtPos[ptV * 3 + 1] = s.y; fwPtPos[ptV * 3 + 2] = s.z;
            fwPtCol[ptV * 3] = s.col[0]; fwPtCol[ptV * 3 + 1] = s.col[1]; fwPtCol[ptV * 3 + 2] = s.col[2];
            fwPtAlpha[ptV] = Math.min(1.0, headA * 1.15);
            fwPtSize[ptV] = s.size * (0.65 + s.life * 0.65);
            ptV++;
          }
        }

        if (lineV > 0) {
          gl.bindBuffer(gl.ARRAY_BUFFER, bufFwLinePos); gl.bufferData(gl.ARRAY_BUFFER, fwLinePos.subarray(0, lineV * 3), gl.DYNAMIC_DRAW);
          gl.bindBuffer(gl.ARRAY_BUFFER, bufFwLineCol); gl.bufferData(gl.ARRAY_BUFFER, fwLineCol.subarray(0, lineV * 3), gl.DYNAMIC_DRAW);
          gl.bindBuffer(gl.ARRAY_BUFFER, bufFwLineAlpha); gl.bufferData(gl.ARRAY_BUFFER, fwLineAlpha.subarray(0, lineV), gl.DYNAMIC_DRAW);
        }
        if (ptV > 0) {
          gl.bindBuffer(gl.ARRAY_BUFFER, bufFwPtPos); gl.bufferData(gl.ARRAY_BUFFER, fwPtPos.subarray(0, ptV * 3), gl.DYNAMIC_DRAW);
          gl.bindBuffer(gl.ARRAY_BUFFER, bufFwPtCol); gl.bufferData(gl.ARRAY_BUFFER, fwPtCol.subarray(0, ptV * 3), gl.DYNAMIC_DRAW);
          gl.bindBuffer(gl.ARRAY_BUFFER, bufFwPtAlpha); gl.bufferData(gl.ARRAY_BUFFER, fwPtAlpha.subarray(0, ptV), gl.DYNAMIC_DRAW);
          gl.bindBuffer(gl.ARRAY_BUFFER, bufFwPtSize); gl.bufferData(gl.ARRAY_BUFFER, fwPtSize.subarray(0, ptV), gl.DYNAMIC_DRAW);
        }

        return { lineV, ptV };
      }

      // ---- State & Camera Choreography ----
      let currentAct = ACT_INTRO;
      let actStartTime = performance.now();
      let lastFrameTime = performance.now();
      let morphProgress = 1.0;
      let autoAdvance = true;
      let daysAnimated = false;
      let heartCounterStart = 0;

      const camEye = [0, 0.4, 11.5];
      const camTarget = [0, 0.0, 0];
      const pointer = { nx: 0, ny: 0, wx: 0, wy: 0, active: false };

      function applyFormation(act, immediate = false) {
        const targetF = formations[act];
        if (!targetF) return;

        if (immediate) {
          fromPos.set(targetF.pos);
          toPos.set(targetF.pos);
          fromCol.set(targetF.col);
          toCol.set(targetF.col);
          morphProgress = 1.0;
        } else {
          const e = morphProgress * morphProgress * (3 - 2 * morphProgress);
          for (let i = 0; i < P_COUNT * 3; i++) {
            fromPos[i] = fromPos[i] + (toPos[i] - fromPos[i]) * e;
            fromCol[i] = fromCol[i] + (toCol[i] - fromCol[i]) * e;
          }
          toPos.set(targetF.pos);
          toCol.set(targetF.col);
          morphProgress = 0.0;
        }

        for (let i = 0; i < P_COUNT; i++) {
          seeds[i * 4 + 1] = targetF.sz[i];
          seeds[i * 4 + 2] = targetF.role[i];
          if (act === ACT_MESSAGE && targetF.role[i] < 1.5) {
            const xNorm = Math.max(0, Math.min(1, (targetF.pos[i * 3] + 6.0) / 12.0));
            seeds[i * 4 + 3] = xNorm;
          } else {
            seeds[i * 4 + 3] = Math.random();
          }
        }
        uploadParticleBuffers();
      }

      function goToAct(nextAct, triggeredByUser = false) {
        if (nextAct < 0 || nextAct > ACT_MESSAGE) return;
        currentAct = nextAct;
        actStartTime = performance.now();

        overlays.forEach((el, idx) => el.classList.toggle('active', idx === currentAct));
        dots.forEach((dot, idx) => dot.classList.toggle('active', idx === currentAct));

        if (currentAct === ACT_MESSAGE) {
          msgLine1El.style.animation = 'none';
          msgLine2El.style.animation = 'none';
          void msgLine1El.offsetWidth;
          msgLine1El.style.animation = '';
          msgLine2El.style.animation = '';
        }

        applyFormation(currentAct, false);

        if (currentAct === ACT_HEART) {
          daysAnimated = false;
          heartCounterStart = performance.now() + 240;
          daysCounterEl.textContent = '0';
        }

        if (currentAct === ACT_TREE) {
          nextFwTime = performance.now() + 620;
          launchFirework3D(-4.8, 3.0, -3.0, false);
          setTimeout(() => { if (currentAct === ACT_TREE) launchFirework3D(4.9, 3.3, -3.2, false); }, 200);
          setTimeout(() => { if (currentAct === ACT_TREE) launchFirework3D(-3.5, 4.2, -3.6, false); }, 560);
          setTimeout(() => { if (currentAct === ACT_TREE) launchFirework3D(3.8, 2.3, -2.8, false); }, 920);
        }

        if (triggeredByUser && currentAct === ACT_INTRO) {
          introHintEl.style.opacity = '0.80';
        }
      }

      function bindAttr(prog, name, buf, size, stride = 0, offset = 0) {
        const loc = gl.getAttribLocation(prog, name);
        if (loc < 0) return -1;
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride, offset);
        return loc;
      }

      function drawScenePass(proj, view, t, actElapsed, beatScale, rotY, mirror, fwCounts, treeOpacity) {
        const floorY = -3.62;
        const focusDist = currentAct === ACT_TREE ? 13.6 : (currentAct === ACT_MESSAGE ? ACT4_CAM_Z : 10.6);

        // 1. Background 3D Fireworks (Lines + Glowing Diamond Heads, always cleanly behind the real spruce tree!)
        if (fwCounts.lineV > 0 || fwCounts.ptV > 0) {
          gl.disable(gl.DEPTH_TEST);
          gl.depthMask(false);
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.ONE, gl.ONE);

          if (fwCounts.lineV > 0) {
            gl.useProgram(fwLineProg);
            gl.uniformMatrix4fv(gl.getUniformLocation(fwLineProg, 'uProj'), false, proj);
            gl.uniformMatrix4fv(gl.getUniformLocation(fwLineProg, 'uView'), false, view);
            gl.uniform1f(gl.getUniformLocation(fwLineProg, 'uMirror'), mirror);
            gl.uniform1f(gl.getUniformLocation(fwLineProg, 'uFloorY'), floorY);
            bindAttr(fwLineProg, 'aPos', bufFwLinePos, 3);
            bindAttr(fwLineProg, 'aCol', bufFwLineCol, 3);
            bindAttr(fwLineProg, 'aAlpha', bufFwLineAlpha, 1);
            gl.drawArrays(gl.LINES, 0, fwCounts.lineV);
          }

          if (fwCounts.ptV > 0) {
            gl.useProgram(fwPtProg);
            gl.uniformMatrix4fv(gl.getUniformLocation(fwPtProg, 'uProj'), false, proj);
            gl.uniformMatrix4fv(gl.getUniformLocation(fwPtProg, 'uView'), false, view);
            gl.uniform1f(gl.getUniformLocation(fwPtProg, 'uMirror'), mirror);
            gl.uniform1f(gl.getUniformLocation(fwPtProg, 'uFloorY'), floorY);
            gl.uniform1f(gl.getUniformLocation(fwPtProg, 'uDpr'), DPR);
            gl.uniform1f(gl.getUniformLocation(fwPtProg, 'uMaxPt'), MAX_PT);
            bindAttr(fwPtProg, 'aPos', bufFwPtPos, 3);
            bindAttr(fwPtProg, 'aCol', bufFwPtCol, 3);
            bindAttr(fwPtProg, 'aAlpha', bufFwPtAlpha, 1);
            bindAttr(fwPtProg, 'aSize', bufFwPtSize, 1);
            gl.drawArrays(gl.POINTS, 0, fwCounts.ptV);
          }
        }

        // 2. Realistic 3D Organic Spruce Tree (Cedar Trunk + Glossy Glass Baubles + 10,500 Feathery Pine-Needle Clusters!)
        if (treeOpacity > 0.01) {
          gl.clear(gl.DEPTH_BUFFER_BIT);
          gl.enable(gl.DEPTH_TEST);
          gl.depthFunc(gl.LEQUAL);
          gl.depthMask(true);
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

          // 2A. Cedar Trunk & Glossy Glass Ornaments
          gl.useProgram(solidProg);
          gl.uniformMatrix4fv(gl.getUniformLocation(solidProg, 'uProj'), false, proj);
          gl.uniformMatrix4fv(gl.getUniformLocation(solidProg, 'uView'), false, view);
          gl.uniform1f(gl.getUniformLocation(solidProg, 'uRotY'), rotY);
          gl.uniform1f(gl.getUniformLocation(solidProg, 'uMirror'), mirror);
          gl.uniform1f(gl.getUniformLocation(solidProg, 'uFloorY'), floorY);
          gl.uniform1f(gl.getUniformLocation(solidProg, 'uTime'), t);
          gl.uniform1f(gl.getUniformLocation(solidProg, 'uOpacity'), treeOpacity);
          gl.uniform3f(gl.getUniformLocation(solidProg, 'uCamPos'), camEye[0], camEye[1], camEye[2]);
          const sStride = 10 * 4;
          bindAttr(solidProg, 'aPos', solidBuf, 3, sStride, 0);
          bindAttr(solidProg, 'aNorm', solidBuf, 3, sStride, 3 * 4);
          bindAttr(solidProg, 'aCol', solidBuf, 3, sStride, 6 * 4);
          bindAttr(solidProg, 'aMat', solidBuf, 1, sStride, 9 * 4);
          gl.drawArrays(gl.TRIANGLES, 0, solidCount);

          // 2B. Lush Feathery Evergreen Spruce Pine-Needle Clusters
          gl.useProgram(pineProg);
          gl.uniformMatrix4fv(gl.getUniformLocation(pineProg, 'uProj'), false, proj);
          gl.uniformMatrix4fv(gl.getUniformLocation(pineProg, 'uView'), false, view);
          gl.uniform1f(gl.getUniformLocation(pineProg, 'uRotY'), rotY);
          gl.uniform1f(gl.getUniformLocation(pineProg, 'uMirror'), mirror);
          gl.uniform1f(gl.getUniformLocation(pineProg, 'uFloorY'), floorY);
          gl.uniform1f(gl.getUniformLocation(pineProg, 'uTime'), t);
          gl.uniform1f(gl.getUniformLocation(pineProg, 'uDpr'), DPR);
          gl.uniform1f(gl.getUniformLocation(pineProg, 'uMaxPt'), MAX_PT);
          gl.uniform1f(gl.getUniformLocation(pineProg, 'uOpacity'), treeOpacity);
          gl.uniform3f(gl.getUniformLocation(pineProg, 'uCamPos'), camEye[0], camEye[1], camEye[2]);
          bindAttr(pineProg, 'aPos', bufPinePos, 3);
          bindAttr(pineProg, 'aNorm', bufPineNorm, 3);
          bindAttr(pineProg, 'aMeta', bufPineMeta, 4);
          gl.drawArrays(gl.POINTS, 0, pineCount);
        }

        // 3. Additive Optical Glow Pass (Wrapping Aurora Ribbons + Fairy Lights + Crystalline Stardust)
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE);
        gl.depthMask(false);
        if (treeOpacity > 0.35) {
          gl.enable(gl.DEPTH_TEST);
        } else {
          gl.disable(gl.DEPTH_TEST);
        }

        if (treeOpacity > 0.01) {
          gl.useProgram(ribbonProg);
          gl.uniformMatrix4fv(gl.getUniformLocation(ribbonProg, 'uProj'), false, proj);
          gl.uniformMatrix4fv(gl.getUniformLocation(ribbonProg, 'uView'), false, view);
          gl.uniform1f(gl.getUniformLocation(ribbonProg, 'uRotY'), rotY);
          gl.uniform1f(gl.getUniformLocation(ribbonProg, 'uMirror'), mirror);
          gl.uniform1f(gl.getUniformLocation(ribbonProg, 'uFloorY'), floorY);
          gl.uniform1f(gl.getUniformLocation(ribbonProg, 'uTime'), t);
          gl.uniform1f(gl.getUniformLocation(ribbonProg, 'uOpacity'), treeOpacity);
          const rStride = 6 * 4;
          bindAttr(ribbonProg, 'aPos', ribbonBuf, 3, rStride, 0);
          bindAttr(ribbonProg, 'aUv', ribbonBuf, 2, rStride, 3 * 4);
          bindAttr(ribbonProg, 'aRibbonId', ribbonBuf, 1, rStride, 5 * 4);
          for (let r = 0; r < RIBBON_COUNT; r++) {
            gl.drawArrays(gl.TRIANGLE_STRIP, ribbonStarts[r], ribbonCounts[r]);
          }
        }

        gl.useProgram(particleProg);
        gl.uniformMatrix4fv(gl.getUniformLocation(particleProg, 'uProj'), false, proj);
        gl.uniformMatrix4fv(gl.getUniformLocation(particleProg, 'uView'), false, view);
        gl.uniform1f(gl.getUniformLocation(particleProg, 'uTime'), t);
        gl.uniform1f(gl.getUniformLocation(particleProg, 'uMorph'), morphProgress);
        gl.uniform1f(gl.getUniformLocation(particleProg, 'uAct'), currentAct);
        gl.uniform1f(gl.getUniformLocation(particleProg, 'uActElapsed'), actElapsed);
        gl.uniform1f(gl.getUniformLocation(particleProg, 'uBeat'), beatScale);
        gl.uniform1f(gl.getUniformLocation(particleProg, 'uRotY'), rotY);
        gl.uniform1f(gl.getUniformLocation(particleProg, 'uMirror'), mirror);
        gl.uniform1f(gl.getUniformLocation(particleProg, 'uFloorY'), floorY);
        gl.uniform1f(gl.getUniformLocation(particleProg, 'uFocusDist'), focusDist);
        gl.uniform1f(gl.getUniformLocation(particleProg, 'uDpr'), DPR);
        gl.uniform1f(gl.getUniformLocation(particleProg, 'uMaxPt'), MAX_PT);
        gl.uniform2f(gl.getUniformLocation(particleProg, 'uPointerWorld'), pointer.wx, pointer.wy);
        gl.uniform1f(gl.getUniformLocation(particleProg, 'uPointerOn'), pointer.active ? 1.0 : 0.0);

        bindAttr(particleProg, 'aFromPos', bufFromPos, 3);
        bindAttr(particleProg, 'aToPos', bufToPos, 3);
        bindAttr(particleProg, 'aFromCol', bufFromCol, 3);
        bindAttr(particleProg, 'aToCol', bufToCol, 3);
        bindAttr(particleProg, 'aSeed', bufSeeds, 4);
        gl.drawArrays(gl.POINTS, 0, P_COUNT);

        // 4. Radiant Diamond Star Topper
        if (treeOpacity > 0.01) {
          gl.disable(gl.DEPTH_TEST);
          gl.useProgram(starProg);
          gl.uniformMatrix4fv(gl.getUniformLocation(starProg, 'uProj'), false, proj);
          gl.uniformMatrix4fv(gl.getUniformLocation(starProg, 'uView'), false, view);
          gl.uniform3f(gl.getUniformLocation(starProg, 'uWorldPos'), 0.0, 4.25, 0.0);
          gl.uniform1f(gl.getUniformLocation(starProg, 'uScale'), 1.42);
          gl.uniform1f(gl.getUniformLocation(starProg, 'uMirror'), mirror);
          gl.uniform1f(gl.getUniformLocation(starProg, 'uFloorY'), floorY);
          gl.uniform1f(gl.getUniformLocation(starProg, 'uTime'), t);
          gl.uniform1f(gl.getUniformLocation(starProg, 'uOpacity'), treeOpacity);
          bindAttr(starProg, 'aCorner', starBuf, 2);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        gl.depthMask(true);
      }

      // ---- Main 60FPS Render Loop ----
      let treeVisualOpacity = 0.0;
      let lakeVisibility = 0.25;

      function render(now) {
        requestAnimationFrame(render);

        const dt = Math.min(0.05, Math.max(0.001, (now - lastFrameTime) / 1000));
        lastFrameTime = now;
        const t = now * 0.001;
        const actElapsed = (now - actStartTime) / 1000;

        if (autoAdvance && currentAct < ACT_MESSAGE) {
          if (now - actStartTime > ACT_DURATIONS[currentAct]) {
            goToAct(currentAct + 1);
          }
        }

        if (morphProgress < 1.0) {
          morphProgress = Math.min(1.0, morphProgress + dt * 0.78);
        }

        if (currentAct === ACT_HEART && !daysAnimated && now >= heartCounterStart) {
          const prog = Math.min(1, (now - heartCounterStart) / 1450);
          const eased = 1 - Math.pow(1 - prog, 4);
          daysCounterEl.textContent = String(Math.round(eased * 181));
          if (prog >= 1) {
            daysCounterEl.textContent = '181';
            daysAnimated = true;
          }
        }

        let desiredEye, desiredTarget, desiredLake;
        if (currentAct === ACT_INTRO) {
          desiredEye = [Math.sin(t * 0.25) * 0.7 + pointer.nx * 0.7, 0.35 - pointer.ny * 0.35, 11.4 - Math.min(actElapsed * 0.22, 1.0)];
          desiredTarget = [0, 0.1, 0];
          desiredLake = 0.28;
        } else if (currentAct === ACT_HEART) {
          desiredEye = [Math.sin(t * 0.35) * 0.9 + pointer.nx * 0.9, 0.45 - pointer.ny * 0.4, isMobile ? 13.0 : 10.6];
          desiredTarget = [0, 0.15, 0];
          desiredLake = 0.72;
        } else if (currentAct === ACT_TREE) {
          const orbit = Math.sin(t * 0.22) * 1.35 + pointer.nx * 1.25;
          desiredEye = [orbit, 0.72 - pointer.ny * 0.38, isMobile ? 16.6 : 13.7];
          desiredTarget = [0, 0.38, 0];
          desiredLake = 1.0;
        } else {
          desiredEye = [pointer.nx * 0.25, -pointer.ny * 0.15, ACT4_CAM_Z];
          desiredTarget = [0, 0, 0];
          desiredLake = 0.52;
        }

        const camLerp = 1 - Math.exp(-2.8 * dt);
        for (let k = 0; k < 3; k++) {
          camEye[k] += (desiredEye[k] - camEye[k]) * camLerp;
          camTarget[k] += (desiredTarget[k] - camTarget[k]) * camLerp;
        }
        lakeVisibility += (desiredLake - lakeVisibility) * (1 - Math.exp(-2.2 * dt));

        const targetTreeOp = currentAct === ACT_TREE ? Math.min(1, Math.max(0, (actElapsed - 0.28) / 0.85)) : 0.0;
        treeVisualOpacity += (targetTreeOp - treeVisualOpacity) * (1 - Math.exp(-4.5 * dt));

        let beatScale = 1.0;
        let rotY = 0.0;
        if (currentAct === ACT_HEART) {
          const cycle = (t * 0.86) % 1;
          const lub = Math.exp(-Math.pow((cycle - 0.14) / 0.055, 2)) * 0.075;
          const dub = Math.exp(-Math.pow((cycle - 0.30) / 0.068, 2)) * 0.045;
          beatScale = 1.0 + lub + dub;
          rotY = Math.sin(t * 0.56) * 0.36;
        } else if (currentAct === ACT_TREE) {
          rotY = t * 0.38;
        }

        const fwCounts = stepFireworks(now, dt);

        const aspect = Math.max(0.3, W / Math.max(1, H));
        const proj = mat4Perspective(FOV_RAD, aspect, 0.1, 80.0);
        const view = mat4LookAt(camEye, camTarget, [0, 1, 0]);
        lastViewMat = view;

        const floorClipY = (proj[5] * (view[5] * (-3.62) + view[13])) /
                           Math.max(0.1, -(view[6] * (-3.62) + view[14]));
        const horizonUvY = Math.max(0.06, Math.min(0.45, floorClipY * 0.5 + 0.5));

        gl.viewport(0, 0, canvas.width, canvas.height);

        // PASS 0: Deep Midnight Sky + Aurora + Frozen Mirror Ice Lake
        gl.disable(gl.DEPTH_TEST);
        gl.depthMask(false);
        gl.disable(gl.BLEND);
        gl.useProgram(skyProg);
        gl.uniform1f(gl.getUniformLocation(skyProg, 'uTime'), t);
        gl.uniform1f(gl.getUniformLocation(skyProg, 'uHorizonY'), horizonUvY);
        gl.uniform1f(gl.getUniformLocation(skyProg, 'uLakeAlpha'), lakeVisibility);
        gl.uniform2f(gl.getUniformLocation(skyProg, 'uResolution'), W, H);
        bindAttr(skyProg, 'aPos', skyBuf, 2);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        // PASS 1: Frozen Lake Real-Time Mirror Reflection Pass
        if (lakeVisibility > 0.08) {
          drawScenePass(proj, view, t, actElapsed, beatScale, rotY, 1.0, fwCounts, treeVisualOpacity);
        }

        // PASS 2: Primary Real-Time 3D Scene Pass
        drawScenePass(proj, view, t, actElapsed, beatScale, rotY, 0.0, fwCounts, treeVisualOpacity);
      }

      function handleResize() {
        W = window.innerWidth;
        H = window.innerHeight;
        if (W <= 0 || H <= 0) return;

        DPR = Math.min(window.devicePixelRatio || 1, 2);
        isMobile = W < 680;
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);

        formations[ACT_MESSAGE] = buildMessageFormation();
        if (currentAct === ACT_MESSAGE) {
          applyFormation(ACT_MESSAGE, true);
        }
      }

      function updatePointer(cx, cy) {
        pointer.nx = (cx / Math.max(1, W) - 0.5) * 2;
        pointer.ny = (cy / Math.max(1, H) - 0.5) * 2;
        const visH = 2.0 * ACT4_CAM_Z * Math.tan(FOV_RAD * 0.5);
        const visW = visH * (W / Math.max(1, H));
        pointer.wx = (cx / Math.max(1, W) - 0.5) * visW;
        pointer.wy = -(cy / Math.max(1, H) - 0.5) * visH;
        pointer.active = true;
      }

      window.addEventListener('mousemove', e => updatePointer(e.clientX, e.clientY));
      window.addEventListener('mouseleave', () => { pointer.active = false; });
      window.addEventListener('touchmove', e => {
        if (e.touches && e.touches[0]) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      window.addEventListener('touchend', () => { pointer.active = false; });

      canvas.addEventListener('click', e => {
        if (!MusicBox.isPlaying() && currentAct === ACT_INTRO) {
          MusicBox.start();
          introHintEl.textContent = '旋律已开启 · 星光正在流转';
          return;
        }
        if (currentAct === ACT_TREE || currentAct === ACT_MESSAGE) {
          // Pixel-perfect 3D ray-unprojected firework: instant visual beacon + blazing rocket exploding at exact click!
          spawnClickBeacon(e.clientX, e.clientY);
          const [wx, wy, wz] = screenToWorldAtZ(e.clientX, e.clientY, -2.8);
          launchFirework3D(wx, Math.max(-2.6, wy), wz, true);
        } else {
          goToAct(currentAct + 1, true);
        }
      });

      dots.forEach(dot => {
        dot.addEventListener('click', e => {
          e.stopPropagation();
          goToAct(Number(dot.dataset.act), true);
        });
      });

      btnNext.addEventListener('click', e => {
        e.stopPropagation();
        goToAct((currentAct + 1) % 4, true);
      });

      btnReplay.addEventListener('click', e => {
        e.stopPropagation();
        autoAdvance = true;
        goToAct(ACT_INTRO, true);
      });

      btnAudio.addEventListener('click', e => {
        e.stopPropagation();
        MusicBox.toggle();
      });

      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === ' ') {
          e.preventDefault();
          goToAct((currentAct + 1) % 4, true);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          goToAct((currentAct + 3) % 4, true);
        }
      });

      window.addEventListener('resize', () => {
        clearTimeout(window.__glResize);
        window.__glResize = setTimeout(handleResize, 160);
      });

      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      formations[ACT_INTRO]   = buildIntroFormation();
      formations[ACT_HEART]   = buildHeartFormation();
      formations[ACT_TREE]    = buildTreeEffectsFormation();
      formations[ACT_MESSAGE] = buildMessageFormation();

      applyFormation(ACT_INTRO, true);
      requestAnimationFrame(render);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          formations[ACT_MESSAGE] = buildMessageFormation();
          if (currentAct === ACT_MESSAGE) {
            applyFormation(ACT_MESSAGE, true);
          }
        });
      }
    })();
  </script>
</body>
</html>
